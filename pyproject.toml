[project]
name = "tp5-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bouhouhoussam", email = "bouhouhoussam1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "ipykernel>=7.4.0",
    "langchain>=1.5.2",
    "langchain-chroma>=1.2.0",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.2.0",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.2.0",
    "langgraph>=1.2.24",
    "langgraph-cli[inmem]>=0.4.44",
    "mcp[cli]<2",
    "pymupdf>=2.2",
    "pypdf>=7.2.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[project.scripts]
tp5-agents = "tp5_agents:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
